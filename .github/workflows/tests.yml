# ─────────────────────────────────────────────────────────────
# QA PIPELINE
# Runs three jobs in parallel on every push/PR to main:
#   1. Playwright tests — cross-browser E2E, API, and contract tests
#   2. Load tests — k6 performance and stress tests
#   3. Docker — verifies the containerized test suite builds and passes
# ─────────────────────────────────────────────────────────────

name: QA Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Job 1: Playwright ────────────────────────────────────
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npx playwright test --ignore-snapshots --grep-invert "sauce-demo"
        # --ignore-snapshots: visual regression baselines are OS-specific
        #   (generated on macOS, CI runs Linux) so we skip screenshot comparisons
        # --grep-invert "sauce-demo": sauce-demo tests hit an external site
        #   (saucedemo.com) which we don't control — excluding them prevents
        #   false failures when that site is slow or down

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ── Job 2: Load tests ───────────────────────────────────
  load-test:
    name: k6 Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start server
        run: node server.js &

      - name: Wait for server
        run: |
          for i in $(seq 1 10); do
            curl -s http://localhost:4173/api/tracks > /dev/null && break
            sleep 1
          done

      - name: Run load test
        run: k6 run load-tests/api-load.js

      - name: Run stress test
        run: k6 run load-tests/api-stress.js

  # ── Job 3: Docker ───────────────────────────────────────
  docker:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build and run tests in Docker
        run: docker compose up --build --exit-code-from tests

      - name: Cleanup
        if: always()
        run: docker compose down
