services:
  app:
    build:
      context: .
      target: app
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173/api/tracks').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 2s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: .
      target: tests
    # Share the app container's network stack so Chromium can reach
    # the server at localhost — avoids Docker DNS issues with browsers
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - CI=true
      - BASE_URL=http://localhost:4173
